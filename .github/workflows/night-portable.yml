name: Night portable
on:
  workflow_dispatch:
  push:
    branches: [night-theme]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify portable x64
        shell: pwsh
        run: ./build-night.ps1 -Platform x64
      - uses: actions/upload-artifact@v4
        with:
          name: WinDirStat-Night-x64
          path: publish/WinDirStat-Night-x64/
          if-no-files-found: error